[llm]
; anthropic 或 openai，决定用哪个客户端类
provider = anthropic
; 接口地址。openai 协议要带 /v1
base_url = http://127.0.0.1:3425
; 写 ${LLM_API_KEY} 表示从环境变量取，密钥不落盘；本机自用的中转也可以直接写明文
api_key = ${LLM_API_KEY}
; 模型 ID，不同的中转命名不同
model_id = group/never-stuck
; 单次回复的输出上限
max_tokens = 64000
; 思考强度：off / low / medium / high / max，留空表示请求里不带这个参数。
; 两家没有的档位会夹到最近的一档（OpenAI 没有 max，会发 high），trace 里看得到。
; 当前模型或中转不支持时留空，写了它不认的参数会 400。
effort =
; 模型流量绕过代理的主机列表（标准 NO_PROXY 语义，逗号分隔，* = 全部绕过）。
; 留空 = 完全尊重环境里的代理变量。本机挂着 socks 代理又没装 socksio、
; 建客户端报 ImportError 时，写 no_proxy = * 或列出中转的主机名即可绕开。
no_proxy =
