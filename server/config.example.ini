[llm]
; anthropic 或 openai，决定用哪个客户端类
provider = anthropic
; 接口地址。openai 协议要带 /v1
base_url = http://127.0.0.1:3425
; 写 ${LLM_API_KEY} 表示从环境变量取，密钥不落盘；本机自用的中转也可以直接写明文
api_key = ${LLM_API_KEY}
; 模型 ID，不同的中转命名不同
model_id = group/never-stuck
; 单次回复的输出上限
max_tokens = 64000
; 思考强度：off / low / medium / high / max，留空表示请求里不带这个参数。
; 两家没有的档位会夹到最近的一档（OpenAI 没有 max，会发 high），trace 里看得到。
; 当前模型或中转不支持时留空，写了它不认的参数会 400。
effort =
; 模型流量绕过代理的主机列表（标准 NO_PROXY 语义，逗号分隔，* = 全部绕行）。
; 留空 = 完全尊重环境里的代理变量。本机挂着 socks 代理又没装 socksio、
; 建客户端报 ImportError 时，写 no_proxy = * 或列出中转的主机名即可绕开。
no_proxy =
; 单次模型请求的读超时（秒），留空默认 120。上游挂起时最多等这么久
; 就报错收线，不再无限「停止中」；流式下约束的是相邻 chunk 的间隔，
; 不是整轮时长。连接超时固定 5 秒，重试 1 次。
; timeout_s = 120

; 可选显式价目。段名必须和上面的 model_id 完全一致；单位是每
; 1,000,000 token 的金额。没有这段时界面只显示“不算钱”，不会估算。
; currency 只是展示标签，这里不做汇率换算。
;[pricing:group/never-stuck]
;currency = USD
;input_per_million = 3
;cache_read_per_million = 0.3
;cache_write_per_million = 3.75
;output_per_million = 15

; MCP 外部工具（第 5 层，可选）：每一个 [mcp:<别名>] 段 = 一个 MCP 服务器
; 子进程，别名只许字母数字下划线。工具以「别名__工具名」出现在 agent 面前。
; 例子服务器在 examples/mcpCount.py，加下面两行（去掉分号）即可试用：
;[mcp:cnt]
;command = python3 examples/mcpCount.py

; 主动性触发器（D27 第一阶段，可选）：每一个 [trigger:<名字>] 段 = 一个
; 触发器，desktop server 常驻时生效（TUI 进程不跑触发器）。触发 = 把
; message 注入一个固定会话跑一轮「无人值守」对话——权限地板是 auto
; 档（bash / start_job 被拒，remember 是唯一被预授权的写），容器化
; （第二阶段）之前不会放宽。触发器的历史看 data/notices.log，
; 会话可以在 TUI /resume 里找到续聊。
; kind 三选一：
;   interval —— 每 every_seconds 秒（最少 60，防触发风暴）；
;   file     —— path 指到的文件内容变了（内容会一起注入，服务器读，
;               不靠模型的 bash）；
;   jobdone  —— 任何一个后台任务跑完（输出尾部一起注入）。
;[trigger:inbox]
;kind = file
;path = data/inbox.md
;message = 有人给你留了话（见下），处理它。
;[trigger:watchjob]
;kind = jobdone
;message = 后台任务跑完了（见下），看看结果需不需要跟进。
